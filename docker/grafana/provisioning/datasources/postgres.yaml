# Локальная база из compose.yaml. Внутри сети compose она — postgres:5432, а не localhost:5433.
apiVersion: 1
datasources:
  - name: job-market
    uid: job-market-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: job_market
    isDefault: true
    jsonData:
      database: job_market
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: job_market
