# Локальная база для разработки. Поднимается сама из `pnpm dev`, вручную —
# `pnpm db:up` / `pnpm db:down` из корня. Данные живут в томе `postgres-data`
# и переживают `down`; стереть их — `docker compose down -v`.
name: job-market

services:
  postgres:
    # Та же мажорная версия, что у базы на Neon.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: job_market
      POSTGRES_PASSWORD: job_market
      POSTGRES_DB: job_market
    # 5433, а не 5432: не конфликтует с Postgres, установленным на машине.
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Создаёт базу для тестов. Скрипты отсюда выполняются только при создании тома.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U job_market -d job_market']
      interval: 2s
      timeout: 5s
      retries: 15

  # Grafana с дашбордом «Движок»: `pnpm grafana:up`, затем http://localhost:3001
  # (admin / admin). Дашборды — JSON, который собирает `packages/dashboards`.
  grafana:
    image: grafana/grafana:13.3.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Автообновление дашборда — не чаще раза в 5 минут: каждый запрос будит Neon.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5m
    # Только localhost: пароль администратора по умолчанию.
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./packages/dashboards/dist:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:3000/api/health']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  grafana-data:
